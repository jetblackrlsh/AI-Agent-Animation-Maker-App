name: Delete existing Actions artifacts

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every active artifact in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r artifact_id; do
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            done
